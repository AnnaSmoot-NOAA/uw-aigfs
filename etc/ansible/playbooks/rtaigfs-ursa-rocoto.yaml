---
# Deploys the Rocoto real-time application directory (app-rocoto/). Scheduling (cron) and the
# production report are handled once, for both streams, by the rtaigfs-ursa-all playbook,
# so this playbook installs no crontab.
- name: Configure rtaigfs-ursa-rocoto
  hosts: localhost
  gather_facts: true

  vars_files:
    - ../roles/rtaigfs_ursa_rocoto/defaults/main.yaml

  vars:
    rtaigfs_app: "{{ rtaigfs_rocoto_install_dir | realpath }}"
    rtaigfs_app_keep: cycles
    rtaigfs_app_role: rtaigfs_ursa_rocoto

  tasks:
    - name: Deploy app-rocoto/
      ansible.builtin.include_tasks: tasks/deploy-app.yaml
